<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ほくしん受注ナビ</title>
  <style>
:root {
  --primary: #2c3e50;
  --primary-hover: #1a252f;
  --accent-warning: #d97706;
  --accent-warning-hover: #b45309;
  --accent-success: #059669;
  --accent-error: #dc2626;
  --bg-main: #0f1419;
  --bg-card: #1a202c;
  --bg-sidebar: #151d28;
  --border: #2d3748;
  --text: #e8eef5;
  --text-muted: #9ca3af;
  --top-bar-bg: #0d1117;
  --top-bar-border: #2d3748;
  --top-bar-text: #f0f4f8;
  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Menlo", "Monaco", "Courier New", monospace;
  --radius-card: 6px;
  --radius-control: 4px;
  --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.4);
  --border-width: 1px;
  --control-height: 48px;
  --space-unit: 8px;
  --motion-duration: 200ms;
  --surface-texture: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.02) 50%, transparent 100%), repeating-linear-gradient(0deg, transparent 0px, rgba(255, 255, 255, 0.01) 1px, transparent 2px, transparent 4px);
  --surface-texture-size: 100% 100%;
  --surface-texture-position: 0 0;
  --status-stopped: #d97706;
  --status-stopped-bg: rgba(217, 119, 6, 0.15);
  --status-stopped-border: #b45309;
  --status-active: #10b981;
  --status-active-bg: rgba(16, 185, 129, 0.12);
  --status-error: #ef4444;
  --status-error-bg: rgba(239, 68, 68, 0.12);
  --status-completed: #6b7280;
  --status-completed-bg: rgba(107, 114, 128, 0.1);
  --line-height-relaxed: 1.6;
  --letter-spacing-relaxed: 0.3px;
}

@supports (backdrop-filter: blur(1px)) {
  :root {
    --card-backdrop: rgba(26, 32, 44, 0.6);
  }
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
}

body {
  font-family: var(--font-family);
  background-color: var(--bg-main);
  color: var(--text);
  line-height: var(--line-height-relaxed);
  letter-spacing: var(--letter-spacing-relaxed);
}

[data-aivic-shell-pattern] {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.shell-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
  background-color: var(--top-bar-bg);
  border-bottom: var(--border-width) solid var(--top-bar-border);
  padding: 0 calc(var(--space-unit) * 2);
  flex-shrink: 0;
  z-index: 100;
}

.shell-logo {
  display: flex;
  align-items: center;
  gap: calc(var(--space-unit) * 1.5);
  font-size: 14px;
  font-weight: 600;
  color: var(--top-bar-text);
  text-decoration: none;
}

.shell-logo-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--primary), var(--accent-warning));
  border-radius: var(--radius-card);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  color: white;
}

.shell-logo-text {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
}

.shell-logo-brand {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.shell-logo-system {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  margin-top: 2px;
}

.shell-user-area {
  display: flex;
  align-items: center;
  gap: calc(var(--space-unit) * 1.5);
}

.shell-user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background-color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  color: white;
  flex-shrink: 0;
}

.shell-user-name {
  font-size: 13px;
  color: var(--top-bar-text);
  min-width: 60px;
}

.shell-logout {
  font-size: 12px;
  color: var(--text-muted);
  text-decoration: none;
  transition: color var(--motion-duration);
}

.shell-logout:hover {
  color: var(--top-bar-text);
}

.shell-container {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.shell-sidebar {
  width: 240px;
  background-color: var(--bg-sidebar);
  border-right: var(--border-width) solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}

.shell-nav {
  display: flex;
  flex-direction: column;
  padding: calc(var(--space-unit) * 2) 0;
  gap: calc(var(--space-unit) * 0.5);
}

.shell-nav-item {
  display: flex;
  align-items: center;
  gap: calc(var(--space-unit) * 1.5);
  padding: calc(var(--space-unit) * 1.5) calc(var(--space-unit) * 2);
  font-size: 13px;
  color: var(--text-muted);
  text-decoration: none;
  cursor: pointer;
  transition: all var(--motion-duration);
  border-left: 3px solid transparent;
  position: relative;
}

.shell-nav-item:hover {
  background-color: rgba(255, 255, 255, 0.05);
  color: var(--text);
}

.shell-nav-item.aivic-active {
  background-color: rgba(44, 62, 80, 0.3);
  color: var(--accent-warning);
  border-left-color: var(--accent-warning);
  font-weight: 500;
}

.shell-nav-icon {
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.shell-content-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.content-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  background-color: var(--bg-main);
  background-image: var(--surface-texture);
  background-size: var(--surface-texture-size);
  background-position: var(--surface-texture-position);
}

[data-aivic-panel] {
  display: block;
}

.shell-footer {
  height: 40px;
  background-color: var(--bg-sidebar);
  border-top: var(--border-width) solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--text-muted);
  flex-shrink: 0;
}

@media (max-width: 768px) {
  .shell-sidebar {
    width: 200px;
  }

  .shell-nav-item {
    padding: calc(var(--space-unit) * 1.25) calc(var(--space-unit) * 1.5);
    font-size: 12px;
  }

  .shell-logo-text {
    display: none;
  }

  .shell-logo-icon {
    width: 28px;
    height: 28px;
    font-size: 14px;
  }
}

@media (max-width: 480px) {
  .shell-header {
    height: 52px;
    padding: 0 calc(var(--space-unit) * 1.5);
  }

  .shell-container {
    flex-direction: column;
  }

  .shell-sidebar {
    width: 100%;
    height: auto;
    border-right: none;
    border-bottom: var(--border-width) solid var(--border);
    overflow-y: visible;
    flex-direction: row;
  }

  .shell-nav {
    flex-direction: row;
    padding: calc(var(--space-unit) * 1) 0;
    gap: 0;
    width: 100%;
    overflow-x: auto;
  }

  .shell-nav-item {
    padding: calc(var(--space-unit) * 1) calc(var(--space-unit) * 1.5);
    font-size: 11px;
    border-left: none;
    border-bottom: 3px solid transparent;
    flex-shrink: 0;
  }

  .shell-nav-item.aivic-active {
    border-left: none;
    border-bottom-color: var(--accent-warning);
  }

  .shell-user-name {
    display: none;
  }

  .shell-logout {
    font-size: 11px;
  }
}

@media (max-width: 360px) {
  .shell-logo-icon {
    width: 24px;
    height: 24px;
    font-size: 12px;
  }

  .shell-user-avatar {
    width: 28px;
    height: 28px;
    font-size: 12px;
  }

  .shell-user-area {
    gap: calc(var(--space-unit) * 1);
  }

  .shell-header {
    padding: 0 calc(var(--space-unit) * 1);
  }
}

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let sortColumn = null;\n  let sortOrder = 'asc';\n  let allProjects = [];\n  const stoppedStates = ['値引き承認待ち', '高額見積確認待ち', '与信確認待ち', '新規取引先前金待ち', '納期遅延通知待ち', '受領書催促中'];\n\n  async function loadProjects() {\n    try {\n      const projects = await window.aivicApi.list(0);\n      allProjects = projects || [];\n      updateSummary();\n      applyFilters();\n    } catch (e) {\n      console.error('Failed to load projects:', e);\n    }\n  }\n\n  function updateSummary() {\n    const counts = { '受注': 0, '進行中': 0, '完了': 0, '停止': 0 };\n    allProjects.forEach(p => {\n      const status = p.status || '受注';\n      if (stoppedStates.includes(status)) counts['停止']++;\n      else if (['出荷完了', '受領書回収済み', '返品受付済み', '返品不受付'].includes(status)) counts['完了']++;\n      else if (['受注確定', '仕入先手配済み', '納期回答待ち', '入荷待ち', '入荷確認済み', '出荷準備中'].includes(status)) counts['進行中']++;\n      else counts['受注']++;\n    });\n    container.querySelector('#count-received').textContent = counts['受注'];\n    container.querySelector('#count-active').textContent = counts['進行中'];\n    container.querySelector('#count-completed').textContent = counts['完了'];\n    container.querySelector('#count-stopped').textContent = counts['停止'];\n\n    const hasCritical = allProjects.some(p => {\n      const deadline = new Date(p.deadline || 0);\n      const handlerDeadline = new Date(p.handlerDeadline || 0);\n      const now = new Date();\n      const threeDays = 3 * 24 * 60 * 60 * 1000;\n      return (deadline - now < threeDays && deadline > now) || (handlerDeadline - now < threeDays && handlerDeadline > now);\n    });\n    if (hasCritical) container.querySelector('#deadline-banner').classList.remove('hidden');\n  }\n\n  function applyFilters() {\n    const priorityFilter = container.querySelector('#priority-filter').value;\n    const statusFilter = container.querySelector('#status-filter').value;\n    const searchText = container.querySelector('#search-input').value.toLowerCase();\n\n    let filtered = allProjects.filter(p => {\n      const matchPriority = !priorityFilter || (p.priority || '中') === priorityFilter;\n      const matchStatus = !statusFilter || (stoppedStates.includes(p.status || '') ? '停止' : (p.status || '受注')) === statusFilter;\n      const matchSearch = !searchText || (p.projectNo || '').toLowerCase().includes(searchText) || (p.customerName || '').toLowerCase().includes(searchText);\n      return matchPriority && matchStatus && matchSearch;\n    });\n\n    if (sortColumn) {\n      filtered.sort((a, b) => {\n        let aVal = a[sortColumn];\n        let bVal = b[sortColumn];\n        if (sortColumn === 'deadline' || sortColumn === 'handlerDeadline') {\n          aVal = new Date(aVal || 0).getTime();\n          bVal = new Date(bVal || 0).getTime();\n        }\n        const cmp = aVal > bVal ? 1 : aVal < bVal ? -1 : 0;\n        return sortOrder === 'asc' ? cmp : -cmp;\n      });\n    }\n\n    renderTable(filtered);\n  }\n\n  function renderTable(projects) {\n    const tbody = container.querySelector('#projects-tbody');\n    tbody.innerHTML = projects.map(p => {\n      const isStoppedState = stoppedStates.includes(p.status || '');\n      const deadline = new Date(p.deadline || 0);\n      const handlerDeadline = new Date(p.handlerDeadline || 0);\n      const now = new Date();\n      const threeDays = 3 * 24 * 60 * 60 * 1000;\n      const isCritical = (deadline - now < threeDays && deadline > now) || (handlerDeadline - now < threeDays && handlerDeadline > now);\n      const isLate = deadline < now || handlerDeadline < now;\n\n      return `<tr class=\"${isStoppedState ? 'stopped-row' : ''}\" onclick=\"showDetail('${p.id || p.projectNo}')\">` +\n        `<td>${p.projectNo || '-'}</td>` +\n        `<td>${p.customerName || '-'}</td>` +\n        `<td><span class=\"state-badge\" data-state=\"${p.status || '受注'}\">` +\n        (stoppedStates.includes(p.status || '') ? '停止' : p.status || '受注') + `</span></td>` +\n        `<td><span class=\"badge priority-${(p.priority || '中').toLowerCase()}\">` +\n        (p.priority || '中') + `</span></td>` +\n        `<td>${deadline.toLocaleDateString('ja-JP')}</td>` +\n        `<td>${handlerDeadline.toLocaleDateString('ja-JP')}</td>` +\n        `<td>${isLate ? '<span class=\\\"warning-icon\\\">!</span>' : isCritical ? '<span style=\\\"color:var(--accent-warning)\\\">!</span>' : ''}</td>` +\n        `</tr>`;\n    }).join('');\n  }\n\n  window.sortTable = function(col) {\n    if (sortColumn === col) sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';\n    else { sortColumn = col; sortOrder = 'asc'; }\n    applyFilters();\n  };\n\n  window.showDetail = function(projectId) {\n    const project = allProjects.find(p => p.id === projectId || p.projectNo === projectId);\n    if (!project) return;\n    const detail = container.querySelector('#detail-content');\n    detail.innerHTML = `<div class=\\\"detail-field\\\"><label>案件番号</label><value>${project.projectNo || '-'}</value></div>` +\n      `<div class=\\\"detail-field\\\"><label>顧客名</label><value>${project.customerName || '-'}</value></div>` +\n      `<div class=\\\"detail-field\\\"><label>ステータス</label><value><span class=\\\"state-badge\\\" data-state=\\\"${project.status || '受注'}\\\">${stoppedStates.includes(project.status || '') ? '停止' : project.status || '受注'}</span></value></div>` +\n      `<div class=\\\"detail-field\\\"><label>優先度</label><value>${project.priority || '-'}</value></div>` +\n      `<div class=\\\"detail-field\\\"><label>納期</label><value>${new Date(project.deadline || 0).toLocaleDateString('ja-JP')}</value></div>` +\n      `<div class=\\\"detail-field\\\"><label>手配期限</label><value>${new Date(project.handlerDeadline || 0).toLocaleDateString('ja-JP')}</value></div>` +\n      `<div class=\\\"detail-field\\\"><label>受注金額</label><value>¥${(project.amount || 0).toLocaleString('ja-JP')}</value></div>`;\n    container.querySelector('#detail-panel').classList.add('visible');\n  };\n\n  window.closeDetailPanel = function() {\n    container.querySelector('#detail-panel').classList.remove('visible');\n  };\n\n  container.querySelector('#priority-filter').addEventListener('change', applyFilters);\n  container.querySelector('#status-filter').addEventListener('change', applyFilters);\n  container.querySelector('#search-input').addEventListener('input', applyFilters);\n  container.addEventListener('keydown', e => {\n    if (e.key === 'Escape') window.closeDetailPanel();\n  });\n\n  loadProjects();\n}";
</script>

  //  閉じられなかった ( ユーザー報告 2026-06-27: ダイアログが閉じない ) 。 ① Esc ② オーバーレイ背景クリック
  //  ③ 閉じる系ボタン の 3 経路で閉じる。 セレクタは複合クラスも拾うよう [class*="overlay"] を含む。
  //  閉じ方は「開クラス ( active/open/show 等 ) があれば外す ( 再オープン可 ) 、 無ければ inline display:none」。
  //  modal-header 等の sub-part を誤って隠さないため [class*="modal"] は使わない。
  var AIVIC_OVERLAY_SELECTOR = '[class*="overlay"],[data-aivic-overlay],[data-modal],[role="dialog"],[role="alertdialog"]';
  var aivicCloseOverlay = function(el) {
    if (!el || !el.classList) return;
    var openClasses = ["active", "open", "show", "visible", "is-open", "is-active", "show-modal"];
    var removed = false;
    for (var c = 0; c < openClasses.length; c++) {
      if (el.classList.contains(openClasses[c])) { el.classList.remove(openClasses[c]); removed = true; }
    }
    if (!removed && el.style) el.style.display = "none";
  };
  document.addEventListener("keydown", function(e) {
    if (e.key !== "Escape" && e.keyCode !== 27) return;
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  });
  document.addEventListener("click", function(e) {
    var t = e.target;
    if (!t) return;
    if (t.closest) {
      var closer = t.closest('.modal-close,[data-modal-close],[data-close],[data-dismiss]');
      if (closer) {
        var oc = closer.closest(AIVIC_OVERLAY_SELECTOR);
        if (oc) { aivicCloseOverlay(oc); return; }
      }
    }
    // 背景 ( オーバーレイ要素そのもの ) を直接クリックした時のみ閉じる ( モーダル本体クリックでは閉じない ) 。
    if (t.matches && t.matches(AIVIC_OVERLAY_SELECTOR) && t === e.target) {
      aivicCloseOverlay(t);
    }
  });
  // 【2026-06-28 強化・ロード時に必ず閉じる】 生成 AI が overlay を初期 display:none にし忘れた場合でも、
  //  ロード直後にダイアログが画面を覆って操作不能になる事故 ( ユーザー報告 2026-06-28: ダイアログが常に表示され
  //  閉じられない ) を防ぐ。 認識可能な overlay/dialog セレクタに該当する要素はロード時に必ず閉じる
  //  ( 開クラス除去 or display:none ) 。 真にロード時表示すべき業務コンテンツは overlay セレクタに該当しないため
  //  影響しない ( パネルコンテナは data-aivic-panel で別管理 ) 。
  var aivicHideOverlaysOnLoad = function() {
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", aivicHideOverlaysOnLoad);
  } else {
    aivicHideOverlaysOnLoad();
  }
})();

</script>
</body>
</html>
